<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RASIBOGA — Warisan Kuliner Rembang</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--red:#BC2328;--cream:#F8EBD8;--teal:#0A8C97;--cocoa:#332320;--bg:#F8EBD8;--card:#FFF8EE;--tx:#332320;--mut:#6b564f;--ln:#e4cfb2;--rt:#BC2328;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1e1513;--card:#2b1e1b;--tx:#f8ebd8;--mut:#c9b29f;--ln:#4a3631;--rt:#ff8a8d;--teal:#4fc3cd}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.65 'PT Serif',Georgia,serif}
h1,h2,h3{font-family:Fraunces,'Bell MT',Georgia,serif;line-height:1.15;margin:0 0 .5em}
a{color:inherit}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.w{max-width:1100px;margin:0 auto;padding:0 20px}
header{background:var(--red);color:var(--cream);position:sticky;top:0;z-index:20}
header .w{display:flex;align-items:center;gap:16px;height:60px}
header img{height:34px}nav{display:flex;gap:4px;margin-left:auto;align-items:center}
nav a{padding:8px 11px;text-decoration:none;border-radius:99px;font-size:15px}
nav a:hover,nav a.on{background:rgba(255,255,255,.18)}
#bm{background:var(--cream);color:var(--red);border:0;border-radius:99px;padding:6px 12px;font-weight:700}
#mb{display:none;margin-left:auto;background:none;border:1px solid var(--cream);color:var(--cream);border-radius:8px;padding:6px 10px}
@media(max-width:820px){#mb{display:block}nav{display:none;position:absolute;top:60px;left:0;right:0;background:var(--red);flex-direction:column;align-items:stretch;padding:8px 20px 16px}nav.open{display:flex}}
.hero{background:var(--red);color:var(--cream);padding:56px 0 72px;border-radius:0 0 40px 40px}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800;max-width:15ch}
.hero p{max-width:52ch;font-size:1.1rem}
.sb{display:flex;gap:8px;max-width:520px;margin-top:20px}
input,select,textarea{font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);width:100%}
.btn{background:var(--red);color:#fff;border:0;border-radius:99px;padding:11px 22px;font-weight:700;text-decoration:none;display:inline-block}
.btn.s{background:transparent;color:var(--rt);border:2px solid var(--rt)}
.hero .btn{background:var(--cream);color:var(--red)}
section{padding:40px 0}h2{font-size:1.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.ph{aspect-ratio:4/3;display:grid;place-items:center;font:800 3rem Fraunces,serif;color:rgba(255,248,238,.9);position:relative}
.ph small{position:absolute;bottom:6px;left:10px;font:12px 'PT Serif';opacity:.85}
.cb{padding:12px 14px 14px;flex:1;display:flex;flex-direction:column;gap:6px}.cb h3{font-size:1.15rem;margin:0}
.cb p{margin:0;font-size:.9rem;color:var(--mut)}
.tag{display:inline-block;font-size:12.5px;padding:2px 10px;border-radius:99px;border:1.5px solid currentColor;width:fit-content;font-weight:700}
.t-khas{color:var(--rt)}.t-adaptasi{color:var(--teal)}.t-umum{color:var(--mut)}
.bk{position:absolute;top:8px;right:8px;background:var(--cream);color:var(--red);border:0;border-radius:50%;width:36px;height:36px;font-size:18px}
.card a.go{margin-top:auto;background:var(--red);color:var(--cream);text-decoration:none;padding:9px 14px;display:flex;justify-content:space-between;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{border:1.5px solid var(--red);background:transparent;color:var(--rt);padding:6px 14px;border-radius:99px}
.chip.on{background:var(--red);color:#fff}
.bar{display:grid;grid-template-columns:2fr 1fr;gap:10px}@media(max-width:600px){.bar{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:20px;margin-bottom:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--mut);margin:8px 0 16px}
li{margin:4px 0}.ing b{display:block;margin-top:10px;font-family:Fraunces,serif}
.step{counter-increment:s}ol.steps{padding-left:22px}
.empty{text-align:center;padding:40px 20px;border:2px dashed var(--ln);border-radius:18px;color:var(--mut)}
footer{background:var(--cocoa);color:var(--cream);padding:32px 0;margin-top:40px;font-size:.9rem}
#intro{position:fixed;inset:0;background:var(--red);z-index:99;display:grid;place-items:center;transition:opacity .8s,filter .8s}
#intro img{width:min(70vw,420px)}#intro.out{opacity:0;filter:blur(14px);pointer-events:none}
#intro button{position:absolute;bottom:28px;right:20px;background:none;border:1px solid var(--cream);color:var(--cream);border-radius:99px;padding:6px 16px}
#ck{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;padding:20px;display:flex;flex-direction:column}
#ck .in{max-width:760px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
.pg{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;background:var(--red);transition:width .4s}
.big{font-size:clamp(1.4rem,4vw,2rem);font-family:Fraunces,serif;margin:24px 0}
.tm{font:800 2.6rem Fraunces;color:var(--teal)}
.nt{border-left:5px solid var(--teal);padding:8px 14px;background:var(--card);margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--cocoa);color:var(--cream);padding:10px 20px;border-radius:99px;z-index:90}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<script>
const F=[{"id": "lontong-tuyuhan", "name": "Lontong Tuyuhan", "cats": "Makanan berat", "origin": "Desa Tuyuhan, Kecamatan Pancur, Kabupaten Rembang", "serv": "4–5 porsi", "time": "±90 menit", "desc": "Lontong Tuyuhan disajikan dengan lontong berbentuk segitiga, ayam kampung, dan kuah santan berbumbu.", "eq": ["Panci besar", "Panci kuah", "Wajan", "Blender/ulekan", "Pisau dan talenan"], "ing": [["Lontong", ["500 g beras", "Daun pisang secukupnya", "Air secukupnya", "Tali untuk mengikat"]], ["Kuah dan lauk", ["½ ekor ayam kampung, potong", "1 liter santan", "2 lembar daun salam", "3 lembar daun jeruk", "2 batang serai, memarkan", "2 cm lengkuas, memarkan", "1 sdm gula merah", "Garam dan minyak secukupnya"]], ["Bumbu halus", ["6 siung bawang merah", "4 siung bawang putih", "4 butir kemiri", "2 cm kunyit", "2 cm jahe", "1 sdt ketumbar", "½ sdt jintan", "3–5 cabai merah keriting", "Merica secukupnya"]]], "st": ["Cuci beras dan tiriskan.", "Bentuk daun pisang menjadi selongsong segitiga, ikat salah satu ujungnya.", "Isi beras sekitar setengah bagian selongsong, lalu tutup dan ikat rapat.", "Rebus lontong hingga matang dan padat; lama perebusan menyesuaikan ukuran lontong.", "Haluskan semua bumbu halus.", "Tumis bumbu hingga harum, masukkan daun salam, daun jeruk, serai, dan lengkuas.", "Masukkan ayam dan aduk hingga terbalut bumbu.", "Tuangkan santan perlahan sambil diaduk agar tidak pecah.", "Tambahkan gula merah dan garam. Masak dengan api kecil hingga ayam empuk.", "Potong lontong dan sajikan bersama ayam serta kuah."], "note": "Rasanya gurih dan kaya rempah. Bentuk lontong segitiga merupakan salah satu ciri khas penyajian. Takaran ini adalah adaptasi rumahan.", "src": "Dinas Kebudayaan dan Pariwisata Kabupaten Rembang, halaman Kuliner: https://dinbudpar.rembangkab.go.id/kuliner/", "pv": "khas", "cat": "makanan-berat"}, {"id": "dumbeg", "name": "Dumbeg", "cats": "Jajanan tradisional", "origin": "Kabupaten Rembang; dikenal di wilayah Pohlandak, Pancur", "serv": "10–12 buah", "time": "±60 menit", "desc": "Dumbeg merupakan jajanan berbahan tepung beras dan gula jawa yang dibungkus daun lontar berbentuk kerucut.", "eq": ["Baskom", "Panci", "Kukusan", "Saringan", "Pengaduk", "Daun lontar"], "ing": [["Bahan adonan", ["250 g tepung beras", "100 g tepung tapioka", "200 g gula merah, sisir", "500 ml santan", "2 lembar daun pandan", "½ sdt garam"]], ["Pembungkus", ["Daun lontar bersih yang dibentuk kerucut"]]], "st": ["Rebus santan, gula merah, pandan, dan garam dengan api kecil hingga gula larut.", "Saring larutan dan biarkan hangat.", "Campur tepung beras dan tapioka.", "Tuangkan larutan santan sedikit demi sedikit sambil diaduk hingga licin.", "Bersihkan daun lontar dan bentuk menjadi kerucut; pastikan bagian bawah tertutup.", "Tuang adonan ke pembungkus, jangan terlalu penuh.", "Kukus sekitar 25–35 menit atau hingga matang.", "Angkat, dinginkan, lalu sajikan."], "note": "Manis, lembut atau kenyal, dan beraroma daun lontar. Resep pembuat tradisional dapat berbeda dalam komposisi dan teknik.", "src": "Dinas Kebudayaan dan Pariwisata Kabupaten Rembang: https://dinbudpar.rembangkab.go.id/kuliner/", "pv": "khas", "cat": "jajanan"}, {"id": "kelo-mrico", "name": "Kelo Mrico", "cats": "Olahan ikan berkuah", "origin": "Pesisir Kabupaten Rembang", "serv": "4 porsi", "time": "±40 menit", "desc": "Kelo Mrico dikenal sebagai olahan ikan dengan kuah berbumbu merica. Resep berikut merupakan adaptasi rumahan untuk menghasilkan kuah gurih, pedas hangat, dan segar.", "eq": ["Panci", "Wajan kecil", "Blender/ulekan", "Pisau dan talenan"], "ing": [["Bahan utama", ["500 g ikan laut, misalnya kakap atau kembung", "700 ml air", "2 buah tomat", "5 buah belimbing wuluh", "2 batang serai", "2 lembar daun salam", "2 lembar daun jeruk", "1 batang daun bawang", "1 sdm air jeruk nipis", "Garam, gula, dan minyak secukupnya"]], ["Bumbu halus", ["6 siung bawang merah", "3 siung bawang putih", "1 sdt merica butiran", "2 cm kunyit", "2 cm jahe", "3 cabai merah", "Cabai rawit sesuai selera"]]], "st": ["Bersihkan ikan, lumuri air jeruk nipis dan sedikit garam selama 10 menit, lalu bilas.", "Haluskan bawang merah, bawang putih, merica, kunyit, jahe, dan cabai.", "Tumis bumbu hingga harum.", "Masukkan serai, daun salam, dan daun jeruk.", "Tuangkan air dan didihkan.", "Masukkan ikan, tomat, dan belimbing wuluh.", "Bumbui dengan garam dan sedikit gula.", "Masak hingga ikan matang; jangan terlalu sering mengaduk.", "Tambahkan daun bawang dan sajikan hangat."], "note": "Merica menjadi rasa yang menonjol. Jenis ikan dan tingkat kepedasan dapat disesuaikan. Formula ini bukan resep baku satu penjual tertentu.", "src": "Visit Jawa Tengah, daftar kuliner Kabupaten Rembang: https://visitjawatengah.jatengprov.go.id/en/regency/kabupaten-rembang/culinary", "pv": "khas", "cat": "makanan-berat"}, {"id": "kaoya-dudul", "name": "Kaoya Dudul / Kaoya", "cats": "Kue tradisional", "origin": "Desa Sendangmulyo, Kecamatan Gunem, Kabupaten Rembang", "serv": "±15–20 buah kecil", "time": "±60 menit", "desc": "Kaoya Dudul atau Kaoya Lontar merupakan kue kering tradisional. Adonan tepung ketan dan kacang hijau dicampur gula, lalu dicetak dan dibungkus daun lontar berbentuk menyerupai daun semanggi.", "eq": ["Wajan untuk menyangrai", "Penggiling/blender kering", "Ayakan", "Baskom", "Cetakan daun lontar"], "ing": [["Bahan", ["150 g tepung beras ketan", "150 g kacang hijau kering", "100–125 g gula pasir halus", "50 g gula jawa, sisir halus", "Sejumput garam", "Air matang secukupnya, sedikit demi sedikit"]], ["Cetakan", ["Daun lontar yang dibersihkan, dilayukan, dan dibentuk menjadi cetakan tradisional"]]], "st": ["Sangrai kacang hijau dengan api kecil hingga matang dan harum, lalu dinginkan.", "Haluskan kacang hijau sangrai dan ayak.", "Siapkan tepung ketan; sangrai ringan bila diperlukan, lalu dinginkan.", "Campur tepung ketan, tepung kacang hijau, gula pasir, gula jawa, dan garam.", "Remas dan aduk hingga tercampur serta dapat dipadatkan. Tambahkan sedikit air hanya bila diperlukan.", "Siapkan cetakan daun lontar yang telah dibentuk.", "Masukkan adonan sedikit demi sedikit ke dalam cetakan dan tekan hingga padat.", "Rapikan bentuk dan biarkan set agar mudah dikeluarkan atau tetap dalam bungkus tradisional.", "Simpan dalam wadah kering dan tertutup."], "note": "Rasanya manis dan gurih. Proses tradisional yang diberitakan menggunakan kacang hijau dan ketan yang disangrai/digiling, gula putih dan gula jawa, serta cetakan daun lontar. Takaran pada resep ini merupakan perkiraan adaptasi karena sumber lokal tidak mencantumkan takaran pasti.", "src": "Budaya Indonesia, Kaoya Dudul: https://budaya-indonesia.org/Kaoya-Dudul ; Rembang Bangkit: https://rembangfokus.blogspot.com/2016/06/enaknya-panganan-kaoya-dudul-jajanan.html", "pv": "khas", "cat": "jajanan"}, {"id": "bakso-lempit", "name": "Bakso Lempit", "cats": "Olahan ayam berkuah", "origin": "Lasem, Kabupaten Rembang", "serv": "4 porsi", "time": "±50 menit", "desc": "Bakso Lempit Lasem berbeda dari bakso bulat. Isian ayam cincang dibungkus kulit tipis seperti pangsit besar, direbus, lalu disajikan dalam kuah bening.", "eq": ["Baskom", "Pisau dan talenan", "Panci kuah", "Panci untuk merebus lempit", "Sendok"], "ing": [["Bahan lempit", ["300 g daging ayam cincang halus", "1 butir putih telur", "2 siung bawang putih, haluskan", "1 sdm tepung tapioka", "½ sdt garam", "¼ sdt merica", "½ sdt kaldu bubuk (opsional)", "Kulit pangsit tipis secukupnya", "Air untuk merebus"]], ["Kuah", ["1,2 liter air atau kaldu ayam", "2 siung bawang putih, geprek", "¼ sdt merica", "Garam secukupnya", "Daun bawang dan seledri", "Bawang goreng untuk taburan"]]], "st": ["Campur ayam cincang, putih telur, bawang putih, tapioka, garam, merica, dan kaldu bubuk.", "Aduk hingga adonan menyatu dan dapat disendokkan.", "Letakkan satu sendok adonan di tengah kulit pangsit.", "Lipat kulit mengelilingi isian dan rekatkan dengan sedikit air. Bentuk seperti bungkusan pipih, bukan bola.", "Didihkan air dalam panci terpisah, kecilkan api, lalu rebus lempit hingga isian ayam matang dan kulitnya lembut.", "Untuk kuah, rebus air/kaldu bersama bawang putih dan merica.", "Bumbui dengan garam. Masukkan lempit yang sudah matang sebentar ke dalam kuah.", "Sajikan dengan daun bawang, seledri, dan bawang goreng."], "note": "Ciri khasnya adalah bentuk bungkus kulit tipis, isian ayam cincang, dan kuah bening gurih. Formula bahan di atas adalah rekonstruksi rumahan; artikel lokal menjelaskan ciri dan cara umum, bukan takaran resep asli.", "src": "Suararembang.com, “Cuma Ada di Lasem, Bakso Ini Tak Dibulatkan tapi Dibungkus Kulit Tipis” (17 Februari 2026): https://www.suararembang.com/kuliner/1522324557/cuma-ada-di-lasem-bakso-ini-tak-dibulatkan-tapi-dibungkus-kulit-tipis", "pv": "khas", "cat": "makanan-berat"}, {"id": "permen-asem", "name": "Permen Asem", "cats": "Permen tradisional", "origin": "Asal khusus Rembang belum terverifikasi", "serv": "±25–30 butir", "time": "±45 menit", "desc": "Permen asem rumahan dibuat dari asam jawa dan gula hingga menjadi adonan pekat yang dapat dibentuk. Resep ini merupakan adaptasi, bukan klaim resep khas Rembang.", "eq": ["Panci kecil", "Saringan", "Sendok kayu", "Nampan atau kertas roti"], "ing": [["Bahan", ["100 g daging asam jawa tanpa biji", "150 g gula merah", "75 g gula pasir", "100 ml air panas", "Sejumput garam", "Gula pasir tambahan untuk pelapis (opsional)"]]], "st": ["Rendam asam jawa dengan air panas selama 10–15 menit.", "Remas perlahan lalu saring untuk memisahkan biji dan serat kasar.", "Masukkan sari asam, gula merah, gula pasir, dan garam ke panci.", "Masak dengan api kecil sambil terus diaduk agar tidak gosong.", "Teruskan memasak hingga adonan mengental dan dapat dibentuk setelah dingin.", "Angkat dan biarkan agak dingin.", "Olesi tangan dengan sedikit minyak atau gunakan sendok, lalu bentuk bulatan kecil.", "Balur dengan gula pasir bila suka.", "Biarkan dingin dan simpan dalam wadah tertutup."], "note": "Rasanya manis-asam. Kekentalan akhir menentukan apakah permen menjadi kenyal atau lebih padat. Jangan mencicipi adonan saat masih panas karena gula panas dapat menyebabkan luka bakar.", "src": "Resep adaptasi rumahan; belum ditemukan rujukan yang memastikan menu ini sebagai kuliner khas Rembang.", "pv": "adaptasi", "cat": "jajanan"}, {"id": "wedang-corong-cemoi", "name": "Wedang Corong / Cemoi", "cats": "Minuman hangat", "origin": "Nama “Wedang Corong” belum terverifikasi; resep diadaptasi dari wedang cemoe/cemoi", "serv": "4–5 gelas", "time": "±30 menit", "desc": "Daftar menu menyebut Wedang Corong dan Wedang Cemoi/Corong. Karena sumber yang ditemukan menjelaskan wedang cemoe, bagian ini menggunakan kuah santan-jahe dan pelengkap sebagai versi adaptasi. Pastikan nama lokal dan racikan aslinya melalui pembuat setempat.", "eq": ["Panci", "Saringan", "Pisau", "Gelas saji"], "ing": [["Kuah", ["1 liter santan encer", "75 g jahe, bakar dan memarkan", "1 batang serai, memarkan", "1 batang kayu manis kecil", "2 lembar daun pandan", "100–125 g gula merah atau gula pasir", "Sejumput garam"]], ["Pelengkap", ["3 lembar roti tawar, potong dadu", "100 g kolang-kaling, rebus dan iris", "75 g kacang tanah sangrai", "100 g kelapa muda (opsional)"]]], "st": ["Siapkan jahe, bakar sebentar hingga harum, lalu memarkan.", "Masukkan santan ke panci bersama jahe, serai, kayu manis, pandan, gula, dan garam.", "Panaskan dengan api kecil sambil diaduk perlahan agar santan tidak pecah.", "Setelah mendidih ringan dan aroma rempah keluar, matikan api.", "Saring kuah bila menginginkan minuman lebih halus.", "Siapkan roti tawar, kolang-kaling, kacang tanah, dan kelapa muda di gelas.", "Siram dengan kuah santan jahe panas.", "Sajikan segera."], "note": "Minuman ini memiliki rasa manis, hangat, dan gurih dari santan. Sumber resep wedang cemoe yang ditemukan menggunakan santan, jahe, kayu manis, pandan, gula, serta pelengkap roti, kolang-kaling, kacang dan kelapa muda. Hubungan nama “corong” dengan resep ini masih perlu dikonfirmasi.", "src": "Adaptasi dari dokumen resep Wedang Cemoi yang terindeks di Scribd; bukan bukti asal-usul Rembang: https://id.scribd.com/document/649285625/Laporan-Praktek-5-Wedang-Cemoe", "pv": "adaptasi", "cat": "minuman"}, {"id": "sop-merah", "name": "Sop Merah", "cats": "Sup", "origin": "Resep rumahan; asal khusus Rembang belum terverifikasi", "serv": "4 porsi", "time": "±45 menit", "desc": "Sop merah merupakan sup berkuah merah dengan tomat atau saus tomat, sayuran, dan protein. Resep berikut adalah versi rumahan sederhana.", "eq": ["Panci", "Wajan", "Pisau dan talenan", "Sendok sayur"], "ing": [["Bahan", ["200 g ayam fillet atau sosis, potong", "1 buah wortel, potong", "1 buah kentang, potong dadu", "100 g kol, iris", "1,2 liter kaldu ayam", "3 sdm saus tomat", "1 buah tomat, potong", "1 batang daun bawang", "Garam, gula, dan merica secukupnya", "1 sdm minyak"]], ["Bumbu", ["3 siung bawang putih, cincang", "½ buah bawang bombai, iris", "¼ sdt pala bubuk (opsional)"]]], "st": ["Tumis bawang putih dan bawang bombai hingga harum.", "Masukkan ayam atau sosis, aduk hingga berubah warna.", "Tuangkan kaldu dan didihkan.", "Masukkan wortel dan kentang, masak hingga mulai empuk.", "Tambahkan saus tomat dan tomat segar.", "Bumbui dengan garam, gula, merica, dan pala.", "Masukkan kol dan daun bawang menjelang akhir.", "Masak hingga seluruh bahan matang, lalu sajikan hangat."], "note": "Kuah berwarna merah dari tomat atau saus tomat. Komposisi sayuran dan protein dapat diubah sesuai ketersediaan. Ini resep sup rumahan, bukan resep tradisional khas Rembang yang terverifikasi.", "src": "Resep adaptasi rumahan.", "pv": "umum", "cat": "makanan-berat"}, {"id": "nasi-goreng-putih", "name": "Nasi Goreng Putih", "cats": "Makanan berat", "origin": "Resep rumahan; asal khusus Rembang belum terverifikasi", "serv": "2 porsi", "time": "±20 menit", "desc": "Nasi goreng putih dibuat tanpa kecap manis sehingga warna nasi tetap terang. Rasa gurih berasal dari bawang, telur, dan bumbu sederhana.", "eq": ["Wajan", "Spatula", "Pisau dan talenan"], "ing": [["Bahan", ["2 piring nasi putih dingin", "2 butir telur", "2 siung bawang putih, cincang", "3 siung bawang merah, iris", "1 batang daun bawang", "1 sdm minyak", "Garam dan merica secukupnya", "½ sdt kaldu bubuk (opsional)"]], ["Pelengkap", ["Irisan mentimun", "Bawang goreng", "Kerupuk (opsional)"]]], "st": ["Siapkan nasi dingin dan uraikan gumpalannya.", "Panaskan minyak, tumis bawang merah dan bawang putih hingga harum.", "Geser bumbu ke sisi wajan, masukkan telur dan orak-arik hingga matang.", "Masukkan nasi, aduk hingga tercampur rata.", "Bumbui dengan garam, merica, dan kaldu bubuk bila digunakan.", "Masukkan daun bawang dan aduk sebentar.", "Koreksi rasa, angkat, lalu sajikan dengan pelengkap."], "note": "Warna nasi tetap putih karena tidak memakai kecap manis atau saus berwarna. Ini variasi nasi goreng rumahan, bukan klaim menu khas Rembang.", "src": "Resep adaptasi rumahan.", "pv": "umum", "cat": "makanan-berat"}, {"id": "ting-ting", "name": "Ting Ting", "cats": "Jajanan manis", "origin": "Jenis permen kacang; asal khusus Rembang belum terverifikasi", "serv": "±15 potong", "time": "±35 menit", "desc": "Ting ting kacang adalah camilan manis renyah yang dibuat dari kacang dan gula karamel. Resep ini merupakan adaptasi rumahan.", "eq": ["Wajan tebal", "Spatula tahan panas", "Loyang beralas kertas roti", "Pisau"], "ing": [["Bahan", ["200 g kacang tanah kupas, sangrai", "150 g gula pasir", "2 sdm air", "1 sdm madu atau air jeruk nipis (opsional)", "Sejumput garam"]]], "st": ["Sangrai kacang hingga matang dan harum, lalu sisihkan dalam keadaan hangat.", "Siapkan loyang beralas kertas roti yang sudah dioles tipis minyak.", "Masukkan gula dan air ke wajan tebal.", "Panaskan dengan api kecil hingga gula larut dan berubah menjadi karamel berwarna keemasan. Jangan menyentuh karamel karena sangat panas.", "Masukkan kacang dan garam, aduk cepat hingga seluruh kacang terlapisi.", "Tuangkan ke loyang dan ratakan menggunakan spatula yang dioles sedikit minyak.", "Biarkan hingga mengeras dan benar-benar dingin.", "Potong menjadi bentuk kecil dengan pisau yang kokoh, lalu simpan dalam wadah kedap udara."], "note": "Teksturnya renyah dengan rasa manis-gurih kacang. Karamel sangat panas; lakukan tahap ini dengan hati-hati dan minta bantuan orang dewasa saat memasak atau memotong.", "src": "Resep adaptasi ting ting kacang rumahan; asal khusus Rembang belum terverifikasi.", "pv": "adaptasi", "cat": "jajanan"}, {"id": "kue-ku", "name": "Kue Ku", "cats": "Kue tradisional", "origin": "Kue tradisional Indonesia; asal khusus Rembang belum terverifikasi", "serv": "±12 buah", "time": "±75 menit", "desc": "Kue ku adalah kue kenyal berwarna cerah dengan kulit tepung ketan dan isian kacang hijau manis. Umumnya dicetak menyerupai tempurung kura-kura.", "eq": ["Kukusan", "Panci", "Wajan", "Cetakan kue ku", "Baskom"], "ing": [["Isian", ["150 g kacang hijau kupas, rendam 2 jam", "100 ml santan", "75 g gula pasir", "Sejumput garam", "1 lembar daun pandan"]], ["Kulit", ["250 g tepung ketan", "50 g kentang kukus, haluskan", "150 ml santan hangat (tambahkan bertahap)", "50 g gula halus", "2 sdm minyak", "Pewarna makanan sesuai selera"]], ["Pelengkap", ["Daun pisang kecil untuk alas, olesi sedikit minyak"]]], "st": ["Kukus kacang hijau yang telah direndam hingga empuk.", "Haluskan kacang hijau, lalu masak bersama santan, gula, garam, dan pandan hingga menjadi pasta yang dapat dipulung.", "Dinginkan isian dan bentuk menjadi bola-bola kecil.", "Campur tepung ketan, kentang halus, gula, dan minyak.", "Tuangkan santan hangat sedikit demi sedikit sambil diuleni hingga adonan lembut dan dapat dibentuk.", "Beri pewarna makanan sesuai selera dan uleni hingga rata.", "Ambil adonan kulit, pipihkan, beri isian, lalu tutup dan bulatkan.", "Masukkan ke cetakan kue ku yang ditaburi sedikit tepung ketan, tekan perlahan, lalu keluarkan.", "Letakkan di atas daun pisang kecil.", "Kukus sekitar 8–12 menit dengan api sedang. Buka tutup kukusan sesekali agar kue tidak melebar berlebihan.", "Angkat, oles tipis minyak, dan sajikan setelah hangat."], "note": "Kulitnya kenyal dan isiannya manis lembut. Bentuk dan warna dapat disesuaikan. Resep ini merupakan resep umum kue ku, bukan kekhasan Rembang yang terverifikasi.", "src": "Resep tradisional umum; formulasi adaptasi rumahan.", "pv": "umum", "cat": "jajanan"}, {"id": "wedang-ronde", "name": "Wedang Ronde", "cats": "Minuman hangat", "origin": "Minuman tradisional Jawa", "serv": "4–5 porsi", "time": "±50 menit", "desc": "Wedang ronde adalah minuman hangat dengan bola-bola kenyal dari tepung ketan, biasanya berisi kacang, disajikan dalam kuah jahe manis.", "eq": ["Panci untuk kuah", "Panci untuk merebus ronde", "Baskom", "Ulekan/blender", "Mangkuk saji"], "ing": [["Bahan ronde", ["200 g tepung ketan", "±150 ml air hangat, tuang bertahap", "Sejumput garam", "Pewarna hijau dan merah (opsional)"]], ["Isian", ["75 g kacang tanah sangrai", "2 sdm gula pasir", "Sejumput garam"]], ["Kuah jahe", ["1,2 liter air", "100 g jahe, bakar dan memarkan", "2 batang serai, memarkan", "2 lembar daun pandan", "150 g gula merah atau gula pasir", "Sejumput garam"]], ["Pelengkap", ["Kacang tanah sangrai", "Kolang-kaling atau potongan roti tawar (opsional)"]]], "st": ["Haluskan kacang sangrai bersama gula dan garam untuk isian.", "Campur tepung ketan dan garam, lalu tuang air hangat sedikit demi sedikit hingga adonan dapat dipulung.", "Bagi adonan dan beri pewarna bila diinginkan.", "Ambil sedikit adonan, pipihkan, beri isian kacang, lalu bulatkan rapat.", "Didihkan air dalam panci terpisah. Rebus ronde hingga mengapung dan matang, lalu tiriskan.", "Untuk kuah, rebus air bersama jahe, serai, dan pandan hingga harum.", "Tambahkan gula dan garam, lalu aduk hingga larut. Saring bila perlu.", "Masukkan ronde ke mangkuk, tambahkan pelengkap, dan siram kuah jahe panas.", "Sajikan selagi hangat."], "note": "Ronde bertekstur kenyal dan kuahnya hangat dengan aroma jahe. el.querySelector('#x').onclick=close;const g=s=>el.querySelector(s);

function bookm(){const l=F.filter(f=>bm.includes(f.id));return `<section><div class="w"><h1>Resep tersimpan</h1>${l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="empty"><h3>Belum ada bookmark</h3><p>Tekan ♡ pada kartu resep untuk menyimpannya di browser ini.</p><a class="btn" href="#kuliner">Jelajahi kuliner</a></div>`}</div></section>`}
const tentang=()=>`<section><div class="w" style="max-width:700px"><h1>Tentang RASIBOGA</h1><p>RASIBOGA mendokumentasikan dan memperkenalkan kuliner tradisional Kabupaten Rembang lewat resep, peta, dan cerita. Setiap menu diberi label: <b>Kuliner Khas Rembang</b>, <b>Resep Adaptasi</b>, atau <b>Resep Umum</b>. Tidak semua menu diklaim asli Rembang.</p><p>Ini prototipe: bookmark tersimpan di browser Anda dan formulir komunitas hanya simulasi.</p></div></section>`;
let tb='kuliner';
function route(){const h=location.hash.slice(1)||'beranda';let p=h,h2='';
document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',h.startsWith(a.dataset.p)));
$('#nv').classList.remove('open');
if(h.startsWith('menu-')){ratio=1;app.innerHTML=detail(h.slice(5));const f=F.find(x=>x.id==h.slice(5));if(f)ings(f)}
else if(h.startsWith('kuliner')){if(h.startsWith('kuliner-'))cf=h.slice(8);app.innerHTML=cat();filt()}
else app.innerHTML={beranda:home,peta:()=>peta(tb),budaya:budaya,komunitas,bookmark:bookm,tentang}[h]?.()||home();
if(h=='budaya')gl();window.scrollTo(0,0)}
function cur(){const h=location.hash.slice(1);return F.find(x=>x.id==h.slice(5))}
document.addEventListener('click',e=>{const t=e.target,d=k=>t.closest('['+k+']');
if(d('data-bk')){e.preventDefault();const y=scrollY;toggle(d('data-bk').dataset.bk);scrollTo(0,y)}
else if(d('data-ck'))cook(F.find(x=>x.id==d('data-ck').dataset.ck));
else if(d('data-c')){cf=d('data-c').dataset.c;app.innerHTML=cat();filt()}
else if(d('data-t')){tb=d('data-t').dataset.t;app.innerHTML=peta(tb)}
else if(d('data-a')){if(+d('data-a').dataset.a==QZ[qi][2]){qs++;toast('Benar!')}else toast('Jawaban: '+QZ[qi][1][QZ[qi][2]]);qi++;$('#qz').innerHTML=quiz()}
else if(t.id=='qr'){qi=0;qs=0;$('#qz').innerHTML=quiz()}
else if(t.id=='so'){so=!so;app.innerHTML=cat();filt()}
else if(t.id=='cl'){q='';cf='';pf='';app.innerHTML=cat();filt()}
else if(t.id=='p'||t.id=='m'||t.id=='rs'){ratio=t.id=='rs'?1:Math.max(.5,ratio+(t.id=='p'?.5:-.5));ings(cur())}
else if(t.id=='mb')$('#nv').classList.toggle('open')});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;filt()}if(e.target.id=='gq')gl()});
document.addEventListener('change',e=>{if(e.target.id=='ps'){pf=e.target.value;filt()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id=='hs'){q=$('#hq').value;cf='';location.hash='kuliner'}if(e.target.id=='kf'){e.target.reset();toast('Terima kasih! (simulasi, data tidak terkirim)')}});
addEventListener('hashchange',route);
const intro=$('#intro'),hide=()=>{intro.classList.add('out');setTimeout(()=>intro.remove(),900)};
$('#sk').onclick=hide;setTimeout(hide,matchMedia('(prefers-reduced-motion:reduce)').matches?300:1800);
save();route();
</script></body></html>
